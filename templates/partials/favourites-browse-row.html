{% load i18n static %}
{# Horizontal favourites row — home page and product detail. #}
{% if favourite_cards %}
<section class="favourites-browse-section {% if section_class %}{{ section_class }}{% else %}mt-10 lg:mt-14{% endif %}">
    <h2 class="font-poppins font-light text-xl lg:text-2xl text-kokkoris-teal-dark tracking-wide mb-6 text-center">
        {% trans "Οι πελάτες προτιμούν συνήθως" %}
    </h2>
    <div class="relative flex items-stretch shadow-[0_8px_24px_rgba(0,0,0,0.12)] bg-white">
        <button type="button"
                class="browse-row-prev hidden lg:flex w-10 shrink-0 items-center justify-center text-slate-300 hover:text-slate-500 transition-colors"
                aria-label="{% trans 'Προηγούμενα προϊόντα' %}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                <path d="M15 6l-6 6 6 6"/>
            </svg>
        </button>

        <div class="favourites-browse-track browse-products-track flex flex-1 overflow-x-auto scroll-smooth snap-x snap-mandatory divide-x divide-slate-300 [&::-webkit-scrollbar]:hidden"
             style="scrollbar-width: none;"
             {% if user_is_authenticated != None %}data-user-authenticated="{{ user_is_authenticated|yesno:'true,false' }}"{% endif %}>
            {% for card in favourite_cards %}
                {% include "products/partials/product_browse_cell.html" with card=card %}
            {% endfor %}
        </div>

        <button type="button"
                class="browse-row-next hidden lg:flex w-10 shrink-0 items-center justify-center text-slate-300 hover:text-slate-500 transition-colors"
                aria-label="{% trans 'Επόμενα προϊόντα' %}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
                <path d="M9 6l6 6-6 6"/>
            </svg>
        </button>
    </div>
</section>
{% endif %}
