{% load i18n static %}
{# Official brand list from SEL_oles etairies.pdf — 2×4 ovals. #}
<div class="home-brand-list mx-auto mt-8 lg:mt-10 mb-10 lg:mb-14 max-w-[1350px]" id="hero-brands">
    {% if homepage_brands %}
        <ul class="home-brand-list__grid">
            {% for brand in homepage_brands %}
                <li>
                    <a href="{{ brand.url }}"
                       class="home-brand-list__link"
                       aria-label="{{ brand.label }}">
                        <img src="{% static brand.image %}"
                             alt="{{ brand.label }}"
                             class="home-brand-list__oval"
                             width="904"
                             height="532"
                             loading="lazy"
                             decoding="async">
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="py-12 text-center text-slate-400 text-sm">
            {% trans "Δεν υπάρχουν μάρκες ακόμα." %}
        </p>
    {% endif %}
</div>
