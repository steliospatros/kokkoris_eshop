{% load i18n %}
{% if user.is_authenticated %}
<div class="hero-welcome-band">
    <p class="hero-welcome-band__text">
        {% trans "Καλωσήρθατε στην σελίδα μας" %}{% if user.first_name or user.last_name %},
            <span class="hero-welcome-band__name">{{ user.first_name }}{% if user.first_name and user.last_name %} {% endif %}{{ user.last_name }}</span>
        {% endif %}
    </p>
</div>
{% endif %}
