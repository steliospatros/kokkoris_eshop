{% load i18n %}
{# Placeholder sidebar — real filter logic will wire in later. #}
<aside class="catalog-filters shrink-0 w-full lg:w-[220px] xl:w-[240px]">
    <div class="sticky top-4 space-y-6">
        <div>
            <h2 class="font-poppins font-semibold text-sm uppercase tracking-wide text-slate-800 border-b border-slate-200 pb-2">
                {% trans "Φίλτρα" %}
            </h2>
            <p class="mt-2 text-xs text-slate-400 font-inter">
                {% trans "Σύντομα διαθέσιμα" %}
            </p>
        </div>

        {% for section in filter_sections %}
            <div>
                <h3 class="font-inter font-semibold text-sm text-slate-700 mb-2">{{ section.title }}</h3>
                <ul class="space-y-2">
                    {% for item in section.items %}
                        <li>
                            <label class="flex items-center gap-2 text-sm text-slate-500 font-inter cursor-not-allowed opacity-60">
                                <input type="checkbox" disabled class="rounded border-slate-300">
                                <span>{{ item }}</span>
                            </label>
                        </li>
                    {% endfor %}
                </ul>
            </div>
        {% endfor %}
    </div>
</aside>
