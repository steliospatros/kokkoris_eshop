{% extends "page.html" %}
{% load i18n static %}

{% block title %}{{ page_title }} — Kokkoris Eshop{% endblock %}

{% block main_class %}w-full max-w-none p-0 m-0{% endblock %}

{% block content %}
<section class="animal-landing animal-landing--{{ animal_slug }}" aria-label="{{ page_title }}">
    <div class="animal-landing__frame">
        <img src="{% static landing_band %}"
             alt=""
             class="animal-landing__band"
             width="{{ landing_band_w }}"
             height="{{ landing_band_h }}"
             decoding="async">
        {% for spot in landing_hotspots %}
            <a href="{{ spot.url }}"
               class="animal-landing__hotspot"
               style="left: {{ spot.left }}%; top: {{ spot.top }}%; width: {{ spot.size }}%;"
               aria-label="{{ spot.label }}">
                <span class="sr-only">{{ spot.label }}</span>
            </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
