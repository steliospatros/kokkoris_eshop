{% load i18n %}
<li class="flex items-center gap-3 py-3 px-4 {% if not forloop.last %}border-b border-slate-100{% endif %}">
    <div class="shrink-0 w-14 h-14 rounded-lg border border-slate-100 bg-slate-50 overflow-hidden flex items-center justify-center">
        {% if line.image_url %}
            <img src="{{ line.image_url }}" alt="" class="w-full h-full object-contain">
        {% else %}
            <span class="w-full h-full bg-slate-100"></span>
        {% endif %}
    </div>
    <div class="flex-1 min-w-0">
        <p class="font-inter text-xs text-slate-800 leading-snug line-clamp-2">{{ line.title }}</p>
        <p class="text-[11px] text-slate-500 font-inter mt-0.5">× {{ line.quantity }}</p>
    </div>
    <p class="font-inter font-semibold text-sm text-slate-800 shrink-0">{{ line.subtotal_display }} €</p>
</li>
